# PXRD training observability and validation-only reconstruction monitoring.
log_every: 50
val_every: 2000
val_batches: 10

monitor_every: 5000
monitor_selection_split: val
monitor_split: val
monitor_num_samples: 128
monitor_num_candidates: 20
monitor_topk: [1, 20]
monitor_chunk_size: 256
monitor_ids_path: null
monitor_seed: 777
monitor_resample_targets: false
monitor_mode: ema               # regular|ema; both is intentionally unsupported
