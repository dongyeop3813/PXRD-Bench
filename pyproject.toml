[project]
name = "pxrd-bench"
version = "0.1.0"
description = "PXRD-Bench and Bragglite: powder diffraction conditioned crystal structure prediction"
readme = "README.md"
license = "MIT AND CC-BY-NC-4.0"
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
requires-python = "==3.12.*"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.15.3",
    "lmdb==1.8.1",
    "pyarrow==22.0.0",
    "average-minimum-distance==1.6.1",
    "ase==3.27.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "matminer==0.9.3",
    "pandas==2.3.3",
    "pymatgen==2024.11.13",
    "smact==2.6",
    "torch==2.8.0",
    "tqdm==4.67.1",
    "wandb==0.23.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "configs"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
"src.models" = ["*.pt"]
configs = ["**/*.yaml", "**/*.json"]
